<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#110d1e" name="theme-color"/>
<meta content="Discover what's next with Piper and continue to the Discord community." name="description"/>
<title>Piper — Welcome</title>
<style>
    :root{
      color-scheme:dark;
      --bg:#110d1e;
      --text:#fff;
      --muted:#c6bbd9;
      --soft:#a99cbf;
      --lilac:#dac1ff;
      --lavender:#ab77ff;
      --purple:#8950e8;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100svh;
      overflow-x:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    body::before{
      content:"";position:fixed;inset:0;z-index:-2;
      background:
        radial-gradient(ellipse 58% 68% at 52% 28%,rgba(117,58,193,.56) 0%,rgba(79,36,137,.24) 47%,transparent 85%),
        radial-gradient(ellipse 47% 57% at 7% 93%,rgba(84,46,146,.34),transparent 80%),
        radial-gradient(ellipse 42% 54% at 99% 84%,rgba(141,75,211,.25),transparent 80%),
        linear-gradient(158deg,#1b1132 0%,#141021 52%,#0d0c17 100%);
    }
    body::after{
      content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.36;
      background-image:radial-gradient(circle,rgba(245,231,255,.55) .7px,transparent 1.5px);
      background-size:34px 34px;
      mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 76%,transparent 100%);
    }
    button,a{-webkit-tap-highlight-color:transparent}
    button:focus-visible,a:focus-visible{outline:3px solid #ead7ff;outline-offset:5px}
    .shell{min-height:100svh;display:flex;flex-direction:column}
    .navbar{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      width:100%;min-height:76px;padding:15px max(23px,calc((100vw - 1100px)/2));
      background:rgba(14,10,25,.42);border-bottom:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(16px);
    }
    .brand{font-size:24px;letter-spacing:-.06em;font-weight:850;line-height:1}
    .brand .mark{color:#b88cff}
    .top-chip{border-radius:999px;padding:10px 14px;background:rgba(169,115,255,.13);border:1px solid rgba(201,159,255,.26);color:#e8d7ff;font-size:11px;letter-spacing:.09em;font-weight:750;text-transform:uppercase;white-space:nowrap}
    .main{width:100%;flex:1;display:grid;place-items:center;padding:36px 18px 48px}
    .scene{width:min(100%,730px);text-align:center;animation:show .3s ease-out both}
    .scene[hidden]{display:none!important}
    .eyebrow{
      display:inline-flex;align-items:center;justify-content:center;gap:9px;
      padding:11px 17px;border:1px solid rgba(210,165,255,.36);background:rgba(88,45,144,.32);
      border-radius:99px;color:#e6d0ff;text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:800;
    }
    .eyebrow .spark{color:#d9b5ff;font-size:16px;line-height:0}
    h1{margin:27px auto 18px;font-weight:850;font-size:clamp(48px,8.3vw,80px);line-height:1.02;letter-spacing:-.066em;max-width:770px;text-wrap:balance}
    .gradient{background:linear-gradient(90deg,#f2e4ff 0%,#d2a7ff 44%,#aa72ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lead{font-size:clamp(15px,2.3vw,18px);line-height:1.7;font-weight:450;color:#dfd5ed;max-width:470px;margin:0 auto 32px}
    .main-cta{
      display:inline-flex;justify-content:center;align-items:center;gap:12px;
      background:linear-gradient(110deg,#e6caff 0%,#c494ff 100%);color:#28123f;
      width:min(100%,405px);min-height:62px;padding:16px 24px;border:0;border-radius:14px;
      cursor:pointer;box-shadow:0 12px 40px rgba(140,82,225,.22);
      font-size:16px;font-weight:820;letter-spacing:-.015em;text-decoration:none;
      transition:transform .17s ease,filter .17s ease,box-shadow .17s ease;
    }
    .main-cta:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 16px 48px rgba(154,87,237,.29)}
    .arrow{font-size:20px;line-height:1;font-weight:450}
    .under-note{margin:19px 0 0;color:#aca0bd;font-size:12px;letter-spacing:.025em}
    .stage{width:min(100%,595px);border:1px solid rgba(216,183,255,.18);border-radius:26px;padding:37px 34px 29px;background:linear-gradient(155deg,rgba(40,26,63,.94),rgba(20,16,33,.97));box-shadow:0 25px 95px rgba(0,0,0,.31),inset 0 1px 0 rgba(255,255,255,.055);backdrop-filter:blur(14px)}
    .stage-icon{width:66px;height:66px;border-radius:21px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(140deg,#9c66e4,#6338a5);box-shadow:0 12px 36px rgba(149,83,237,.24);font-size:28px}
    .stage-tag{display:inline-block;border-radius:999px;border:1px solid rgba(198,151,255,.28);background:rgba(161,99,247,.12);padding:7px 13px;color:#dbc1ff;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
    h2{font-size:clamp(34px,6vw,48px);letter-spacing:-.055em;line-height:1.08;margin:15px 0 13px;font-weight:820}
    .stage-desc{max-width:430px;margin:0 auto 25px;font-size:15px;line-height:1.6;color:#d0c2e0}
    .steps{display:grid;gap:11px;text-align:left;margin-bottom:26px}
    .step{display:flex;align-items:center;gap:15px;padding:15px 16px;border-radius:14px;background:rgba(255,255,255,.043);border:1px solid rgba(255,255,255,.075)}
    .number{display:grid;place-items:center;width:41px;height:41px;flex:none;border-radius:12px;background:rgba(167,111,250,.2);border:1px solid rgba(194,148,255,.24);color:#e7d4ff;font-size:16px;font-weight:850}
    .step strong{display:block;font-size:14px;line-height:1.32;font-weight:780;color:#fcfaff}
    .step p{margin:4px 0 0;color:#bdb1ce;font-size:12px;line-height:1.45}
    .stage .main-cta{width:100%;min-height:60px}
    .back{margin:17px 0 0;padding:8px 11px;border:0;background:transparent;color:#bcb0cd;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .back:hover{color:#fff}
    .footer{padding:18px 16px 22px;text-align:center;font-size:12px;color:#988baa;border-top:1px solid rgba(255,255,255,.06)}
    @keyframes show{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:530px){
      .navbar{min-height:65px;padding:12px 20px}
      .brand{font-size:23px}
      .top-chip{font-size:10px;padding:9px 11px}
      .main{padding:32px 16px 35px}
      h1{font-size:clamp(44px,12vw,58px);margin-top:24px}
      .lead{line-height:1.6;margin-bottom:30px}
      .stage{padding:31px 18px 22px;border-radius:21px}
      .stage-icon{width:58px;height:58px;margin-bottom:17px}
      .step{padding:13px 12px;gap:12px}
      .number{width:38px;height:38px}
      .main-cta{min-height:59px}
    }
    @media(prefers-reduced-motion:reduce){.scene{animation:none}.main-cta{transition:none}}
  </style>
</head>
<body>
<div class="shell">
<header class="navbar">
<div class="brand">Pipe<span class="mark">.</span></div>
<div class="top-chip">✦ You're invited</div>
</header>
<main class="main">
<!-- Screen 1: visitors must press this button to reveal the Discord step. -->
<section aria-labelledby="welcome-heading" class="scene" id="welcome">
<div class="eyebrow"><span aria-hidden="true" class="spark">✦</span> A little something for you</div>
<h1 id="welcome-heading">Ready to see the<br/><span class="gradient">Real?</span></h1>
<p class="lead">There's more waiting on the other side. Tap below to see what comes next.</p>
<a class="main-cta" href="https://discord.com/invite/ZgvNrpRBe" id="start">Continue <span aria-hidden="true" class="arrow">→</span></a>
</section>
<!-- Screen 2: the Discord invitation only appears after clicking Continue. -->
</main>
</div>
</body>
</html>
